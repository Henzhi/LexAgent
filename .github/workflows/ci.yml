name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Test (unit)
        run: uv run pytest tests/ -v --tb=short --ignore=tests/test_api.py

  frontend-build:
    # 前端此前零校验（审查报告：构建失败不会在 CI 暴露）。npm ci + vitest +
    # vite build 三门禁：lock 文件不一致直接失败，store 单测防行为回归，
    # 构建产物写回 ../static（emptyOutDir）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (store unit)
        run: npm test

      - name: Build
        run: npm run build
