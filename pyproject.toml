[project]
name = "law-rag-agent"
version = "0.1.0"
description = "基于本地 LLM 的法律法规智能问答系统（RAG + 多 Agent）"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Henzhi" },
]

dependencies = [
    # ---- Web / API 层（支撑需求：F-08、NF-1）----
    "fastapi~=0.115.0",          # 0.115.14 — 稳定，与 pydantic 2.10.x 深度兼容
    "uvicorn[standard]~=0.34.0",  # 0.34.3  — 支持 StreamingResponse 流式输出
    "pydantic~=2.10.0",          # 2.10.6  — FastAPI 数据校验核心
    "python-dotenv~=1.0.0",      # 1.0.1   — 环境变量管理
    # ---- Agent / RAG 编排（支撑需求：F-05、F-07、NF-3）----
    "langchain~=1.3.0",          # 1.3.11 — 最新稳定版，Tool/Retriever/记忆抽象
    "langgraph~=1.2.0",          # 1.2.8  — StateGraph 有状态多 Agent 编排
    # D-M3-13：LLM 层迁移到 LangChain 标准生态（BaseChatModel + bind_tools）
    "langchain-openai>=1.6.0",   # 1.6.0  — DeepSeek 等 OpenAI 兼容后端的标准 ChatModel
    "langchain-ollama>=1.1.0",   # 1.1.0  — Ollama 本地降级后端的标准 ChatModel
    # ---- 向量检索（支撑需求：F-04、NF-1）----
    # v0.6 纯 PG 架构：检索统一走 pgvector（halfvec + HNSW），已移除 FAISS/BM25
    # v0.7 混合检索：Python 端 BM25（jieba 分词 + rank-bm25），rank-based 融合（不融合分数）
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    # ---- Embedding（支撑需求：F-03、NF-3）----
    # 直接调用 Ollama API（D-M3-13 后仍走 ollama SDK，与 LLM 层的 ChatOllama 互不干扰）
    # 使用 ollama Python SDK 调用 nomic-embed-text
    # 不再依赖 sentence-transformers，无需 torch/scipy 等大体积 ML 包
    # ---- 爬虫（支撑需求：F-01、NF-2、C-1）----
    "requests~=2.32.0",          # 2.32.5 — HTTP 客户端
    "beautifulsoup4~=4.12.0",    # 4.12.3 — HTML 解析
    "selenium~=4.27.0",          # 4.27.1 — 动态页面兜底
    # ---- 本地 LLM 客户端（支撑需求：C-2、C-3、NF-2）----
    # ⚠️ 下限由 langchain-ollama 1.1.0 决定（其要求 ollama>=0.6.1），不能写 ~=0.4.0
    "ollama>=0.6.1,<1.0.0",      # 0.6.2 — 对接本地 Ollama 服务（Embedding 也走此 SDK）
    "torch>=2.5",
    "sentence-transformers>=3.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",                # FAQ 语义缓存 Redis Stack 后端（向量检索 + 原生 TTL）
    "openai>=2.47.0",
    "tavily-python>=0.7.0",      # 通用网络搜索（F3，M1 唯一新增运行时依赖）
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "tiktoken>=0.13.0",
]

[tool.uv]
# 本项目为应用程序（非 Python 库），不构建分发包
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# PyTorch CUDA 12.4（用于 GPU 推理，Reranker 需要）
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.ruff.lint]
ignore = ["E402", "E702"]  # E402: import not at top, E702: semicolon

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]
